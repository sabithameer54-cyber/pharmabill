name: Build PharmaBill Android APK

run-name: PharmaBill APK Build #${{ github.run_number }}

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PharmaBill Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # 2. SHOW REPOSITORY
      # ============================================================
      - name: Show repository files
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "PHARMABILL APK BUILD"
          echo "============================================"

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch:     $GITHUB_REF_NAME"
          echo "Commit:     $GITHUB_SHA"

          echo ""
          echo "Repository contents:"
          find . -maxdepth 5 -type f \
            ! -path "./.git/*" \
            | sort

      # ============================================================
      # 3. FIND AND EXTRACT PHARMABILL.ZIP
      # ============================================================
      - name: Extract PharmaBill ZIP
        id: extract
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "FINDING PHARMABILL.ZIP"
          echo "============================================"

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/PharmaBill.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/PharmaBill.zip"
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname "PharmaBill.zip" \
              | head -1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: PharmaBill.zip was not found."

            echo ""
            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 8 \
              -type f \
              ! -path "*/.git/*" \
              | sort

            exit 1
          fi

          echo "ZIP FILE:"
          echo "$ZIP_FILE"

          PROJECT_ROOT="$GITHUB_WORKSPACE/pharmabill-project"

          rm -rf "$PROJECT_ROOT"
          mkdir -p "$PROJECT_ROOT"

          echo ""
          echo "ZIP CONTENTS:"
          unzip -l "$ZIP_FILE" | head -300

          echo ""
          echo "EXTRACTING..."

          unzip -q "$ZIP_FILE" -d "$PROJECT_ROOT"

          echo ""
          echo "EXTRACTION COMPLETE."

          echo ""
          echo "EXTRACTED FILES:"
          find "$PROJECT_ROOT" \
            -maxdepth 8 \
            -type f \
            | sort \
            | head -500

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. FIND package.json
      # ============================================================
      - name: Find PharmaBill project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="${{ steps.extract.outputs.project_root }}"

          echo "============================================"
          echo "SEARCHING FOR package.json"
          echo "============================================"

          PACKAGE_JSON=$(find "$PROJECT_ROOT" \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            | head -1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found."

            echo ""
            echo "Extracted files:"
            find "$PROJECT_ROOT" \
              -maxdepth 12 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "package.json:"
          echo "$PACKAGE_JSON"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: ""

      # ============================================================
      # 6. CHECK NODE PROJECT
      # ============================================================
      - name: Check Node project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "NODE PROJECT"
          echo "============================================"

          echo "Directory:"
          pwd

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "PACKAGE.JSON:"
          cat package.json

      # ============================================================
      # 7. INSTALL NPM DEPENDENCIES
      # ============================================================
      - name: Install npm dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "INSTALLING NPM DEPENDENCIES"
          echo "============================================"

          if [ -f package-lock.json ]; then
            echo "Using package-lock.json"

            npm ci \
              --legacy-peer-deps \
              --no-audit \
              --no-fund
          else
            echo "No package-lock.json found."

            npm install \
              --legacy-peer-deps \
              --no-audit \
              --no-fund
          fi

      # ============================================================
      # 8. DETECT CAPACITOR
      # ============================================================
      - name: Detect Capacitor
        id: capacitor
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "DETECTING CAPACITOR"
          echo "============================================"

          CAP_VERSION=$(node - <<'NODE'
          const p = require('./package.json');

          const version =
            p.dependencies?.["@capacitor/core"] ||
            p.devDependencies?.["@capacitor/core"] ||
            "";

          process.stdout.write(version);
          NODE
          )

          echo "Detected Capacitor:"
          echo "${CAP_VERSION:-NOT FOUND}"

          CAP_MAJOR=$(echo "$CAP_VERSION" | grep -oE '[0-9]+' | head -1 || true)

          if [ -z "$CAP_MAJOR" ]; then
            CAP_MAJOR="7"
          fi

          echo "Capacitor major version:"
          echo "$CAP_MAJOR"

          echo "cap_major=$CAP_MAJOR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 9. INSTALL CAPACITOR
      # ============================================================
      - name: Install Capacitor
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          CAP_MAJOR="${{ steps.capacitor.outputs.cap_major }}"

          echo "============================================"
          echo "INSTALLING CAPACITOR"
          echo "============================================"

          npm install \
            "@capacitor/core@${CAP_MAJOR}" \
            "@capacitor/android@${CAP_MAJOR}" \
            --save \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

          npm install \
            "@capacitor/cli@${CAP_MAJOR}" \
            --save-dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

          echo ""
          echo "Capacitor CLI:"
          npx cap --version

      # ============================================================
      # 10. CAPACITOR CONFIGURATION
      # ============================================================
      - name: Prepare Capacitor configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "CAPACITOR CONFIGURATION"
          echo "============================================"

          rm -f capacitor.config.ts
          rm -f capacitor.config.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.pharmabill.app",
            "appName": "PharmaBill",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          echo ""
          cat capacitor.config.json

      # ============================================================
      # 11. BUILD WEB APPLICATION
      # ============================================================
      - name: Build web application
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "BUILDING WEB APPLICATION"
          echo "============================================"

          if npm run | grep -qE '^[[:space:]]+build'; then
            npm run build
          else
            echo "ERROR: package.json has no build script."

            echo ""
            echo "Available npm scripts:"
            npm run

            exit 1
          fi

          echo ""
          echo "Checking dist directory..."

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."

            echo ""
            echo "Project directories:"
            find . -maxdepth 5 -type d \
              ! -path "./node_modules/*" \
              | sort

            exit 1
          fi

          echo ""
          echo "DIST CONTENTS:"
          find dist -type f \
            | sort \
            | head -300

      # ============================================================
      # 12. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 13. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "ANDROID SDK"
          echo "============================================"

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name "sdkmanager" \
              -executable \
              2>/dev/null \
              | sort -V \
              | tail -1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find \
              /usr/local/lib/android \
              /opt/android-sdk \
              /opt/android \
              -type f \
              -name "sdkmanager" \
              -executable \
              2>/dev/null \
              | sort -V \
              | tail -1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo ""
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installing Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "ANDROID SDK READY."

      # ============================================================
      # 14. CREATE ANDROID PROJECT
      # ============================================================
      - name: Create Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "ANDROID PROJECT"
          echo "============================================"

          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            echo "Android project does not exist."
            echo "Creating Android project..."

            npx cap add android
          fi

          if [ ! -d "android" ]; then
            echo "ERROR: Android project was not created."
            exit 1
          fi

          echo ""
          echo "Android project ready."

      # ============================================================
      # 15. CAPACITOR SYNC
      # ============================================================
      - name: Sync Capacitor
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "CAPACITOR SYNC"
          echo "============================================"

          npx cap sync android

      # ============================================================
      # 16. CHECK ANDROID GRADLE PROJECT
      # ============================================================
      - name: Check Android Gradle project
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "ANDROID GRADLE PROJECT"
          echo "============================================"

          chmod +x gradlew

          echo ""
          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          ./gradlew --version

          echo ""
          echo "ANDROID PROJECT FILES:"
          find . -maxdepth 4 -type f \
            ! -path "*/build/*" \
            | sort \
            | head -400

      # ============================================================
      # 17. BUILD APK
      # ============================================================
      - name: Build debug APK
        id: gradle_build
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        run: |
          set +e

          echo "============================================"
          echo "BUILDING PHARMABILL APK"
          echo "============================================"

          chmod +x gradlew

          LOG="$GITHUB_WORKSPACE/gradle-build.log"

          echo "Gradle log:"
          echo "$LOG"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            > "$LOG" 2>&1

          BUILD_EXIT=$?

          echo ""
          echo "============================================"
          echo "GRADLE BUILD RESULT"
          echo "============================================"

          echo "Exit code: $BUILD_EXIT"

          if [ "$BUILD_EXIT" -ne 0 ]; then

            echo ""
            echo "============================================"
            echo "ACTUAL GRADLE ERROR"
            echo "============================================"

            echo ""
            echo "---------- FAILURE ----------"

            grep -n -A 60 -B 15 \
              "FAILURE:" \
              "$LOG" \
              | tail -150 || true

            echo ""
            echo "---------- EXECUTION FAILED ----------"

            grep -n -A 50 -B 15 \
              "Execution failed for task" \
              "$LOG" \
              | tail -150 || true

            echo ""
            echo "---------- AAPT / ANDROID ----------"

            grep -niE \
              "AAPT|AAPT2|Android resource|resource .* not found|Manifest merger|duplicate|compileSdk|buildTools|SDK" \
              "$LOG" \
              | tail -150 || true

            echo ""
            echo "---------- JAVA / KOTLIN ----------"

            grep -niE \
              "Kotlin|kotlinc|javac|Java compilation|Compilation failed|Unresolved reference" \
              "$LOG" \
              | tail -150 || true

            echo ""
            echo "---------- DEPENDENCY ERRORS ----------"

            grep -niE \
              "Could not resolve|Could not find|Could not determine|dependency|dependencies" \
              "$LOG" \
              | tail -150 || true

            echo ""
            echo "---------- CAUSED BY ----------"

            grep -n -A 30 \
              "Caused by:" \
              "$LOG" \
              | tail -150 || true

            echo ""
            echo "============================================"
            echo "LAST 250 LINES"
            echo "============================================"

            tail -250 "$LOG"

            echo ""
            echo "============================================"
            echo "APK BUILD FAILED"
            echo "============================================"

            exit "$BUILD_EXIT"
          fi

          echo ""
          echo "============================================"
          echo "APK BUILD SUCCESSFUL"
          echo "============================================"

      # ============================================================
      # 18. ALWAYS UPLOAD GRADLE LOG
      # ============================================================
      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PharmaBill-Gradle-Log-${{ github.run_number }}
          path: ${{ github.workspace }}/gradle-build.log
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 19. FIND APK
      # ============================================================
      - name: Find generated APK
        id: apk
        if: success()
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "FINDING GENERATED APK"
          echo "============================================"

          APK=$(find android \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | sort \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Searching all APK files:"
            find android \
              -type f \
              -name "*.apk" \
              2>/dev/null \
              | sort || true

            echo ""
            echo "Searching build outputs:"
            find android \
              -type f \
              -path "*/build/outputs/*" \
              2>/dev/null \
              | sort \
              | head -500 || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/PharmaBill-debug.apk

          echo ""
          echo "FINAL APK:"
          ls -lh release/PharmaBill-debug.apk

      # ============================================================
      # 20. UPLOAD APK ARTIFACT
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PharmaBill-APK-${{ github.run_number }}
          path: ${{ steps.project.outputs.project_dir }}/release/PharmaBill-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 21. CREATE GITHUB RELEASE
      # ============================================================
      - name: Create GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pharmabill-${{ github.run_number }}
          name: PharmaBill APK ${{ github.run_number }}
          body: |
            # PharmaBill Android APK

            Build: ${{ github.run_number }}

            Commit: ${{ github.sha }}

            File:
            PharmaBill-debug.apk
          files: ${{ steps.project.outputs.project_dir }}/release/PharmaBill-debug.apk
          generate_release_notes: false

      # ============================================================
      # 22. SUCCESS MESSAGE
      # ============================================================
      - name: Build successful
        if: success()
        shell: bash
        run: |
          echo ""
          echo "============================================"
          echo "PHARMABILL APK BUILD SUCCESSFUL"
          echo "============================================"
          echo ""
          echo "APK: PharmaBill-debug.apk"
          echo ""
          echo "The APK is available in:"
          echo "  GitHub Actions > Artifacts"
          echo "  GitHub Releases"
          echo ""
          echo "============================================"
