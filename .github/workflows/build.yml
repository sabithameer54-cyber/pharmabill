name: Build PharmaBill Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-apk:
    name: Build PharmaBill APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # 2. EXTRACT ZIP IF PRESENT
      # ==========================================================
      - name: Extract PharmaBill ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted
          else
            echo "No ZIP file found."
          fi

          echo "Repository contents:"
          find . -maxdepth 4 -type f \
            -not -path "./.git/*" \
            | sort | head -300

      # ==========================================================
      # 3. FIND package.json
      # ==========================================================
      - name: Find application directory
        shell: bash
        run: |
          set -e

          PACKAGE_JSON=$(find . \
            -type f \
            -name "package.json" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "package.json:"
          echo "$PACKAGE_JSON"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================================
      # 4. SHOW PROJECT
      # ==========================================================
      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -f package.json

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "package.json:"
          cat package.json

      # ==========================================================
      # 5. SETUP NODE
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager-cache: false

      # ==========================================================
      # 6. CHECK NODE
      # ==========================================================
      - name: Check Node.js
        run: |
          node --version
          npm --version

      # ==========================================================
      # 7. INSTALL DEPENDENCIES
      # ==========================================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      # ==========================================================
      # 8. INSTALL CAPACITOR 7
      # ==========================================================
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            --save \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      # ==========================================================
      # 9. REMOVE OLD CAPACITOR CONFIG
      # ==========================================================
      - name: Remove old Capacitor configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.mjs
          rm -f capacitor.config.cjs

          echo "Old Capacitor configuration removed."

      # ==========================================================
      # 10. CREATE JSON CAPACITOR CONFIG
      # ==========================================================
      - name: Create Capacitor JSON configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.pharmabill.app",
            "appName": "PharmaBill",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

          echo "Created capacitor.config.json:"
          cat capacitor.config.json

      # ==========================================================
      # 11. BUILD WEB APP
      # ==========================================================
      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm run build

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            echo "Checking available directories:"
            find . -maxdepth 2 -type d | sort
            exit 1
          fi

          echo "Web build successful."
          echo "dist contents:"
          find dist -maxdepth 2 -type f | head -100

      # ==========================================================
      # 12. REMOVE BROKEN ANDROID DIRECTORY
      # ==========================================================
      - name: Prepare Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -d "android" ]; then
            echo "Removing old Android platform..."
            rm -rf android
          fi

          echo "Android directory prepared."

      # ==========================================================
      # 13. ADD ANDROID
      # ==========================================================
      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npx cap add android

      # ==========================================================
      # 14. SETUP JAVA
      # ==========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ==========================================================
      # 15. SETUP ANDROID SDK
      # ==========================================================
      - name: Setup Android
        uses: android-actions/setup-android@v3

      # ==========================================================
      # 16. SYNC ANDROID
      # ==========================================================
      - name: Sync Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npx cap sync android

      # ==========================================================
      # 17. BUILD DEBUG APK
      # ==========================================================
      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # 18. FIND APK
      # ==========================================================
      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find android \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find android \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/PharmaBill.apk

          echo ""
          echo "Final APK:"
          ls -lh release/PharmaBill.apk

      # ==========================================================
      # 19. UPLOAD ACTUAL APK
      # ==========================================================
      - name: Upload PharmaBill APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaBill-APK
          path: ${{ env.PROJECT_DIR }}/release/PharmaBill.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 20. BUILD SUMMARY
      # ==========================================================
      - name: Build summary
        run: |
          echo "=============================================="
          echo "       PHARMABILL APK BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "Artifact: PharmaBill-APK"
          echo "File: PharmaBill.apk"
          echo ""
          echo "The APK is available in GitHub Actions Artifacts."
          echo "=============================================="
