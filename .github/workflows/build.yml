name: Build PharmaBill

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build PharmaBill
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Extract PharmaBill ZIP
      # ==========================================================
      - name: Extract PharmaBill ZIP
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          ls -la

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -iname "*.zip" \) \
            | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"

            mkdir -p extracted

            unzip -o "$ZIP_FILE" -d extracted

            echo "Extraction completed."
            echo "Extracted files:"
            find extracted -maxdepth 3 -type f | head -100
          else
            echo "No ZIP file found."
            echo "Using repository files directly."
          fi

      # ==========================================================
      # 3. Find application directory
      # ==========================================================
      - name: Find application directory
        shell: bash
        run: |
          set -e

          echo "Searching for package.json..."

          PACKAGE_JSON=$(find . \
            -type f \
            -name "package.json" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found."
            echo ""
            echo "All project files:"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo "package.json found:"
          echo "$PACKAGE_JSON"

          echo "Application directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================================
      # 4. Verify Node project
      # ==========================================================
      - name: Verify Node project
        shell: bash
        run: |
          set -e

          echo "Project directory: $PROJECT_DIR"

          if [ "$PROJECT_DIR" = "." ]; then
            ls -la
          else
            ls -la "$PROJECT_DIR"
          fi

          test -f "$PROJECT_DIR/package.json"

          echo ""
          echo "package.json found successfully."

      # ==========================================================
      # 5. Setup Node.js
      #
      # IMPORTANT:
      # NO npm cache
      # NO dependency cache
      #
      # This fixes:
      # "Some specified paths were not resolved,
      # unable to cache dependencies."
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager-cache: false

      # ==========================================================
      # 6. Check Node and npm
      # ==========================================================
      - name: Check Node.js
        shell: bash
        run: |
          node --version
          npm --version

      # ==========================================================
      # 7. Install dependencies
      # ==========================================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Installing dependencies..."

          npm install --no-audit --no-fund

      # ==========================================================
      # 8. TypeScript check
      # ==========================================================
      - name: Type check
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found."
            echo "Skipping type check."
          fi

      # ==========================================================
      # 9. Build application
      # ==========================================================
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm run build

      # ==========================================================
      # 10. Verify build
      # ==========================================================
      - name: Verify build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "       PharmaBill BUILD SUCCESS"
          echo "========================================"

          if [ -d "dist" ]; then
            echo ""
            echo "dist directory:"
            find dist -maxdepth 2 -type f | sort
          else
            echo ""
            echo "ERROR: dist directory was not created."
            exit 1
          fi

      # ==========================================================
      # 11. Build summary
      # ==========================================================
      - name: Build summary
        shell: bash
        run: |
          echo "========================================"
          echo "PharmaBill CI completed successfully."
          echo "Node.js: $(node --version)"
          echo "npm: $(npm --version)"
          echo "========================================"
