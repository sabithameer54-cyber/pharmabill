name: Build PharmaBill APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PharmaBill Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # =========================================================
      # 2. SHOW REPOSITORY
      # =========================================================
      - name: Show repository files
        shell: bash
        run: |
          echo "===== Repository ====="
          pwd
          ls -la
          echo
          echo "===== Files ====="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            | sort | head -300

      # =========================================================
      # 3. EXTRACT PHARMABILL ZIP
      # =========================================================
      - name: Extract PharmaBill ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "PharmaBill.zip" ]; then
            ZIP_FILE="PharmaBill.zip"
          elif [ -f "pharmabill.zip" ]; then
            ZIP_FILE="pharmabill.zip"
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f \
              \( -iname "*.zip" \) \
              ! -path "./.git/*" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No PharmaBill ZIP file found."
            echo
            echo "Available ZIP files:"
            find . -type f -iname "*.zip" \
              ! -path "./.git/*" || true
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p _pharmabill_source

          unzip -q -o "$ZIP_FILE" -d _pharmabill_source

          echo
          echo "===== Extracted files ====="
          find _pharmabill_source -maxdepth 4 -type f \
            ! -path '*/node_modules/*' \
            | head -300

      # =========================================================
      # 4. FIND ACTUAL APPLICATION DIRECTORY
      # =========================================================
      - name: Find application directory
        id: app
        shell: bash
        run: |
          set -e

          echo "Searching for package.json..."

          PACKAGE_JSON=$(find _pharmabill_source \
            -type f \
            -name "package.json" \
            ! -path "*/node_modules/*" \
            ! -path "*/.git/*" \
            | head -n 1 || true)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found."
            echo
            echo "Extracted directory:"
            find _pharmabill_source -maxdepth 5 -type f \
              ! -path "*/node_modules/*" \
              | sort | head -500
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE_JSON")

          echo "Application directory:"
          echo "$APP_DIR"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

          echo
          echo "===== package.json ====="
          cat "$PACKAGE_JSON"

      # =========================================================
      # 5. SET NODE.JS
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          package-manager-cache: false

      # =========================================================
      # 6. VERIFY NODE
      # =========================================================
      - name: Verify Node.js
        shell: bash
        run: |
          node --version
          npm --version

      # =========================================================
      # 7. INSTALL NPM DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e

          npm install \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      # =========================================================
      # 8. SHOW CAPACITOR VERSION
      # =========================================================
      - name: Check Capacitor
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          echo "===== Capacitor ====="
          npx cap --version || true

          echo
          echo "===== Capacitor packages ====="
          npm list @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            --depth=0 || true

      # =========================================================
      # 9. BUILD WEB APP
      # =========================================================
      - name: Build web application
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e

          if npm run | grep -q " build"; then
            echo "Running npm build..."
            npm run build
          else
            echo "No npm build script found."
            echo "Continuing..."
          fi

      # =========================================================
      # 10. SETUP JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 11. VERIFY JAVA
      # =========================================================
      - name: Verify Java
        shell: bash
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # =========================================================
      # 12. SETUP ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # =========================================================
      # 13. VERIFY ANDROID SDK
      # =========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "sdkmanager:"
          command -v sdkmanager

          echo
          sdkmanager --version

          echo
          echo "adb:"
          command -v adb
          adb version

          echo
          echo "Installed SDK packages:"
          sdkmanager --list_installed | head -100

      # =========================================================
      # 14. ACCEPT ANDROID LICENSES
      # =========================================================
      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      # =========================================================
      # 15. INSTALL REQUIRED ANDROID PACKAGES
      # =========================================================
      - name: Install Android build packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # 16. CHECK ANDROID PROJECT
      # =========================================================
      - name: Check Android project
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          echo "Checking Android project..."

          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            echo "Android project does not exist."
            echo "Generating Android project..."

            npx cap add android
          fi

      # =========================================================
      # 17. CAPACITOR SYNC
      # =========================================================
      - name: Capacitor sync
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e

          npx cap sync android

      # =========================================================
      # 18. MAKE GRADLE EXECUTABLE
      # =========================================================
      - name: Prepare Gradle
        working-directory: ${{ env.APP_DIR }}/android
        shell: bash
        run: |
          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      # =========================================================
      # 19. CLEAN AND BUILD APK
      # =========================================================
      - name: Build Debug APK
        working-directory: ${{ env.APP_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            assembleDebug

      # =========================================================
      # 20. FIND APK
      # =========================================================
      - name: Find generated APK
        id: apk
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find android \
            -type f \
            -name "*.apk" \
            | grep -E "debug|release" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            APK=$(find android \
              -type f \
              -name "*.apk" \
              | head -n 1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo
            echo "Android build files:"
            find android \
              -type f \
              | grep -E "\.apk$|build.gradle|settings.gradle" \
              | head -200 || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p ../release

          cp "$APK" "../release/PharmaBill-debug.apk"

          ABS_APK="$(cd .. && pwd)/release/PharmaBill-debug.apk"

          echo "APK_PATH=$ABS_APK" >> "$GITHUB_ENV"
          echo "apk_path=$ABS_APK" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 21. VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -f "$APK_PATH"

          echo "APK:"
          ls -lh "$APK_PATH"

          echo
          echo "APK file command:"
          file "$APK_PATH"

      # =========================================================
      # 22. UPLOAD APK AS ACTIONS ARTIFACT
      # =========================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: PharmaBill-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # =========================================================
      # 23. CREATE GITHUB RELEASE WITH REAL APK
      # =========================================================
      - name: Create GitHub Release APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pharmabill-apk-${{ github.run_number }}
          name: PharmaBill APK Build ${{ github.run_number }}
          body: |
            PharmaBill Android APK

            Build number: ${{ github.run_number }}
            Commit: ${{ github.sha }}

            Download the APK directly from the Assets section below.
          files: ${{ env.APK_PATH }}
          generate_release_notes: false

      # =========================================================
      # 24. BUILD SUMMARY
      # =========================================================
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## PharmaBill APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$APK_PATH" ]; then
            echo "### APK successfully created" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**File:** PharmaBill-debug.apk" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Size:** $(du -h "$APK_PATH" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK was not created" >> "$GITHUB_STEP_SUMMARY"
          fi
