name: Build PharmaBill

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build PharmaBill
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Extract PharmaBill ZIP if present
      # =========================================================
      - name: Extract PharmaBill ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -iname "*.zip" \) \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted
            echo "ZIP extraction completed."
          else
            echo "No ZIP found."
            echo "Using repository files directly."
          fi

      # =========================================================
      # 3. Find package.json
      # =========================================================
      - name: Find application directory
        shell: bash
        run: |
          set -e

          PACKAGE_JSON=$(find . \
            -type f \
            -name "package.json" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo "package.json found at:"
          echo "$PACKAGE_JSON"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 4. Verify project
      # =========================================================
      - name: Verify Node project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/package.json"

          echo "Project verified successfully."
          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"

      # =========================================================
      # 5. Setup Node.js
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager-cache: false

      # =========================================================
      # 6. Check Node.js
      # =========================================================
      - name: Check Node.js
        run: |
          node --version
          npm --version

      # =========================================================
      # 7. Install dependencies
      # =========================================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm install \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      # =========================================================
      # 8. Type check
      # =========================================================
      - name: Type check
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found."
            echo "Skipping type check."
          fi

      # =========================================================
      # 9. Build
      # =========================================================
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm run build

      # =========================================================
      # 10. Verify build output
      # =========================================================
      - name: Verify build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo "========================================"
          echo "       PHARMABILL BUILD SUCCESS"
          echo "========================================"

          echo ""
          echo "Build files:"
          find dist -maxdepth 3 -type f | sort

      # =========================================================
      # 11. Upload build artifact
      # =========================================================
      - name: Upload PharmaBill artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmaBill-build
          path: ${{ env.PROJECT_DIR }}/dist
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 12. Build summary
      # =========================================================
      - name: Build summary
        run: |
          echo "========================================"
          echo "PharmaBill CI completed successfully."
          echo "Artifact: PharmaBill-build"
          echo "Node.js: $(node --version)"
          echo "npm: $(npm --version)"
          echo "========================================"
