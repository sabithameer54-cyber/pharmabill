# =========================================================
      # 20. PREPARE CAPACITOR CLI
      # =========================================================

      - name: Prepare Capacitor CLI
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking Capacitor packages..."

          CORE_VERSION=$(npm pkg get dependencies.@capacitor/core 2>/dev/null | tr -d '"' || true)

          if [ -z "$CORE_VERSION" ] || [ "$CORE_VERSION" = "undefined" ] || [ "$CORE_VERSION" = "null" ]; then
            CORE_VERSION=$(npm pkg get devDependencies.@capacitor/core 2>/dev/null | tr -d '"' || true)
          fi

          echo "Capacitor Core version: $CORE_VERSION"

          if [[ "$CORE_VERSION" =~ ^([0-9]+)\. ]]; then
            CAP_MAJOR="${BASH_REMATCH[1]}"
          else
            echo "Could not detect Capacitor version."
            echo "Installing current Capacitor packages."

            npm install \
              --save-dev \
              @capacitor/cli \
              --legacy-peer-deps

            npm install \
              @capacitor/core \
              @capacitor/android \
              --legacy-peer-deps

            CAP_MAJOR="latest"
          fi

          if [ "$CAP_MAJOR" != "latest" ]; then

            echo "Using Capacitor major version: $CAP_MAJOR"

            npm install \
              --save-dev \
              "@capacitor/cli@^${CAP_MAJOR}.0.0" \
              --legacy-peer-deps

            npm install \
              "@capacitor/core@^${CAP_MAJOR}.0.0" \
              "@capacitor/android@^${CAP_MAJOR}.0.0" \
              --legacy-peer-deps

          fi

          echo
          echo "Capacitor CLI:"
          npx --yes cap --version

          echo
          echo "Capacitor packages:"
          npm list \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            --depth=0 \
            || true


      # =========================================================
      # 21. CHECK / CREATE ANDROID PROJECT
      # =========================================================

      - name: Check Android project
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          if [ -d "android" ] && [ -f "android/gradlew" ]; then

            echo "Android project already exists."
            echo "Skipping cap add android."

          else

            echo "Android project does not exist."
            echo "Creating Android project..."

            rm -rf android

            npx --yes cap add android

          fi


      # =========================================================
      # 22. CAPACITOR SYNC
      # =========================================================

      - name: Capacitor sync Android
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e

          echo "Running Capacitor sync..."

          npx --yes cap sync android

          echo "Capacitor sync completed."


      # =========================================================
      # 23. VERIFY ANDROID PROJECT
      # =========================================================

      - name: Verify Android project
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "ERROR: android directory was not created."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew was not created."
            exit 1
          fi

          echo "Android project successfully created."

          ls -la android
