name: PharmaBill APK Build

run-name: Build PharmaBill APK ${{ github.run_number }}

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PharmaBill Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # 2. SHOW ORIGINAL REPOSITORY
      # ============================================================
      - name: Show repository
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PHARMABILL APK BUILD"
          echo "=========================================="

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch:     $GITHUB_REF_NAME"
          echo "Commit:     $GITHUB_SHA"

          echo ""
          echo "Repository files:"

          find . -maxdepth 4 -type f \
            ! -path "./.git/*" \
            | sort

      # ============================================================
      # 3. FIND AND EXTRACT PHARMABILL.ZIP
      # ============================================================
      - name: Extract PharmaBill project
        id: extract
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING PHARMABILL PROJECT"
          echo "=========================================="

          ZIP_FILE=""

          # Look for PharmaBill.zip first
          if [ -f "$GITHUB_WORKSPACE/PharmaBill.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/PharmaBill.zip"
          fi

          # Case-insensitive fallback
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -iname "PharmaBill.zip" \
              | head -1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: PharmaBill.zip was not found."

            echo ""
            echo "Files in repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              ! -path "*/.git/*" \
              | sort

            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          PROJECT_ROOT="$GITHUB_WORKSPACE/pharmabill-project"

          rm -rf "$PROJECT_ROOT"
          mkdir -p "$PROJECT_ROOT"

          echo ""
          echo "ZIP contents:"
          unzip -l "$ZIP_FILE" | head -200

          echo ""
          echo "Extracting..."

          unzip -q "$ZIP_FILE" -d "$PROJECT_ROOT"

          echo ""
          echo "Extraction completed."

          echo ""
          echo "Extracted files:"
          find "$PROJECT_ROOT" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -300

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. FIND package.json INSIDE EXTRACTED ZIP
      # ============================================================
      - name: Find PharmaBill package.json
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="${{ steps.extract.outputs.project_root }}"

          echo "=========================================="
          echo "SEARCHING EXTRACTED PROJECT"
          echo "=========================================="

          PACKAGE_JSON=$(find "$PROJECT_ROOT" \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            | head -1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo ""
            echo "ERROR: package.json was not found inside PharmaBill.zip."

            echo ""
            echo "Extracted repository:"
            find "$PROJECT_ROOT" \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo ""
          echo "package.json FOUND:"
          echo "$PACKAGE_JSON"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: ""

      # ============================================================
      # 6. CHECK PROJECT
      # ============================================================
      - name: Check project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PHARMABILL PROJECT"
          echo "=========================================="

          echo "Directory:"
          pwd

          echo ""
          echo "package.json:"
          cat package.json

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f \
            ! -path "./node_modules/*" \
            | sort \
            | head -300

      # ============================================================
      # 7. INSTALL NPM DEPENDENCIES
      # ============================================================
      - name: Install npm dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING NPM DEPENDENCIES"
          echo "=========================================="

          if [ -f package-lock.json ]; then
            echo "package-lock.json found."

            npm ci \
              --legacy-peer-deps \
              --no-audit \
              --no-fund
          else
            echo "No package-lock.json found."

            npm install \
              --legacy-peer-deps \
              --no-audit \
              --no-fund
          fi

      # ============================================================
      # 8. DETECT CAPACITOR
      # ============================================================
      - name: Detect Capacitor
        id: capacitor
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          CAP_VERSION=$(node - <<'NODE'
          const p = require('./package.json');

          const v =
            p.dependencies?.["@capacitor/core"] ||
            p.devDependencies?.["@capacitor/core"] ||
            "";

          process.stdout.write(v);
          NODE
          )

          echo "Detected Capacitor:"
          echo "${CAP_VERSION:-NOT INSTALLED}"

          CAP_MAJOR=$(echo "$CAP_VERSION" | grep -oE '[0-9]+' | head -1 || true)

          if [ -z "$CAP_MAJOR" ]; then
            CAP_MAJOR="7"
          fi

          echo "Using Capacitor major: $CAP_MAJOR"

          echo "cap_major=$CAP_MAJOR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 9. INSTALL CAPACITOR
      # ============================================================
      - name: Install Capacitor
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          CAP_MAJOR="${{ steps.capacitor.outputs.cap_major }}"

          echo "=========================================="
          echo "CAPACITOR SETUP"
          echo "=========================================="

          npm install \
            "@capacitor/core@${CAP_MAJOR}" \
            "@capacitor/android@${CAP_MAJOR}" \
            --save \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

          npm install \
            --save-dev \
            "@capacitor/cli@${CAP_MAJOR}" \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

          echo ""
          echo "Capacitor version:"
          npx cap --version

      # ============================================================
      # 10. CREATE CAPACITOR CONFIG
      # ============================================================
      - name: Prepare Capacitor configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CAPACITOR CONFIGURATION"
          echo "=========================================="

          rm -f capacitor.config.ts
          rm -f capacitor.config.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.pharmabill.app",
            "appName": "PharmaBill",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          echo ""
          cat capacitor.config.json

      # ============================================================
      # 11. BUILD WEB APPLICATION
      # ============================================================
      - name: Build web application
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING WEB APPLICATION"
          echo "=========================================="

          if npm run | grep -qE '^[[:space:]]+build'; then
            npm run build
          else
            echo "ERROR: No build script exists."

            echo ""
            echo "Available scripts:"
            npm run

            exit 1
          fi

          echo ""
          echo "Checking dist..."

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."

            echo ""
            echo "Directories:"
            find . -maxdepth 4 -type d \
              ! -path "./node_modules/*" \
              | sort

            exit 1
          fi

          echo ""
          echo "dist files:"
          find dist -type f | sort | head -300

      # ============================================================
      # 12. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 13. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name "sdkmanager" \
              -executable \
              2>/dev/null \
              | sort -V \
              | tail -1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find \
              /usr/local/lib/android \
              /opt/android-sdk \
              /opt/android \
              -type f \
              -name "sdkmanager" \
              -executable \
              2>/dev/null \
              | sort -V \
              | tail -1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "Accepting licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 14. CREATE ANDROID PROJECT
      # ============================================================
      - name: Create Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            echo "Android project does not exist."
            echo "Creating Android project..."

            npx cap add android
          fi

          if [ ! -d "android" ]; then
            echo "ERROR: Android project was not created."
            exit 1
          fi

      # ============================================================
      # 15. SYNC CAPACITOR
      # ============================================================
      - name: Sync Capacitor
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CAPACITOR SYNC"
          echo "=========================================="

          npx cap sync android

      # ============================================================
      # 16. CHECK GRADLE
      # ============================================================
      - name: Check Android Gradle project
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID GRADLE"
          echo "=========================================="

          chmod +x gradlew

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

      # ============================================================
      # 17. BUILD APK
      # ============================================================
      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ============================================================
      # 18. FIND APK
      # ============================================================
      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINDING APK"
          echo "=========================================="

          APK=$(find android \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | sort \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "APK files:"
            find android \
              -type f \
              -name "*.apk" \
              2>/dev/null || true

            echo ""
            echo "Build output:"
            find android \
              -type f \
              -path "*/build/outputs/*" \
              2>/dev/null \
              | sort \
              | head -300

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/PharmaBill-debug.apk

          echo ""
          echo "Final APK:"
          ls -lh release/PharmaBill-debug.apk

      # ============================================================
      # 19. UPLOAD APK ARTIFACT
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaBill-APK-${{ github.run_number }}
          path: ${{ steps.project.outputs.project_dir }}/release/PharmaBill-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 20. CREATE GITHUB RELEASE
      # ============================================================
      - name: Create GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pharmabill-${{ github.run_number }}
          name: PharmaBill APK ${{ github.run_number }}
          body: |
            PharmaBill Android APK

            Build number: ${{ github.run_number }}

            Commit:
            ${{ github.sha }}

            APK:
            PharmaBill-debug.apk
          files: ${{ steps.project.outputs.project_dir }}/release/PharmaBill-debug.apk
          generate_release_notes: false

      # ============================================================
      # 21. SUCCESS
      # ============================================================
      - name: Build successful
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " PHARMABILL APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "PharmaBill-debug.apk has been created."
          echo ""
          echo "=========================================="
