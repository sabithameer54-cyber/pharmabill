name: Build PharmaBill Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-apk:
    name: Build PharmaBill APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. EXTRACT ZIP IF PRESENT
      # =========================================================
      - name: Extract PharmaBill ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found:"
            echo "$ZIP_FILE"

            unzip -o "$ZIP_FILE" -d extracted

            echo "ZIP extracted."
          else
            echo "No ZIP file found."
          fi

          echo ""
          echo "Repository files:"
          find . \
            -maxdepth 4 \
            -type f \
            -not -path "./.git/*" \
            | sort \
            | head -300

      # =========================================================
      # 3. FIND package.json AUTOMATICALLY
      # =========================================================
      - name: Find application directory
        shell: bash
        run: |
          set -e

          PACKAGE_JSON=$(find . \
            -type f \
            -name "package.json" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "=========================================="
          echo "package.json found:"
          echo "$PACKAGE_JSON"
          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"
          echo "=========================================="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 4. VERIFY PROJECT
      # =========================================================
      - name: Verify Node project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f package.json ]; then
            echo "ERROR: package.json is missing."
            exit 1
          fi

          echo "Project:"
          pwd

          echo ""
          echo "Files:"
          ls -la

      # =========================================================
      # 5. SETUP NODE
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager-cache: false

      # =========================================================
      # 6. CHECK NODE
      # =========================================================
      - name: Check Node.js
        run: |
          node --version
          npm --version

      # =========================================================
      # 7. INSTALL NPM DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci \
              --legacy-peer-deps \
              --no-audit \
              --no-fund
          else
            npm install \
              --legacy-peer-deps \
              --no-audit \
              --no-fund
          fi

      # =========================================================
      # 8. INSTALL CAPACITOR 7
      # =========================================================
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            --save \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      # =========================================================
      # 9. REMOVE OLD CAPACITOR CONFIG
      # =========================================================
      - name: Remove old Capacitor configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.mjs
          rm -f capacitor.config.cjs

          echo "Old Capacitor configuration removed."

      # =========================================================
      # 10. CREATE CAPACITOR JSON CONFIG
      # =========================================================
      - name: Create Capacitor configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.pharmabill.app",
            "appName": "PharmaBill",
            "webDir": "dist"
          }
          EOF

          echo "Capacitor configuration:"
          cat capacitor.config.json

      # =========================================================
      # 11. BUILD WEB APPLICATION
      # =========================================================
      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm run build

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo "Web build successful."

      # =========================================================
      # 12. REMOVE OLD ANDROID PROJECT
      # =========================================================
      - name: Prepare Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          rm -rf android

          echo "Old Android directory removed."

      # =========================================================
      # 13. ADD ANDROID PLATFORM
      # =========================================================
      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npx cap add android

      # =========================================================
      # 14. SETUP JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # =========================================================
      # 15. SET ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi

          echo "Using Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Available SDK manager:"
          sdkmanager --version

      # =========================================================
      # 16. INSTALL ONLY VALID MODERN SDK PACKAGES
      # =========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # 17. SYNC CAPACITOR
      # =========================================================
      - name: Sync Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npx cap sync android

      # =========================================================
      # 18. CHECK GRADLE
      # =========================================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          java -version

          ./gradlew --version

      # =========================================================
      # 19. BUILD DEBUG APK
      # =========================================================
      - name: Build Android Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================================
      # 20. FIND APK
      # =========================================================
      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find android \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find android \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/PharmaBill.apk

          echo ""
          echo "Final APK:"
          ls -lh release/PharmaBill.apk

      # =========================================================
      # 21. VERIFY APK
      # =========================================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -f release/PharmaBill.apk

          FILE_SIZE=$(stat -c%s release/PharmaBill.apk)

          if [ "$FILE_SIZE" -lt 10000 ]; then
            echo "ERROR: APK appears to be invalid or empty."
            exit 1
          fi

          echo "APK verification successful."
          echo "Size: $FILE_SIZE bytes"

      # =========================================================
      # 22. UPLOAD APK ARTIFACT
      # =========================================================
      - name: Upload PharmaBill APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaBill-APK
          path: ${{ env.PROJECT_DIR }}/release/PharmaBill.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 23. SUCCESS SUMMARY
      # =========================================================
      - name: Build summary
        run: |
          echo ""
          echo "=============================================="
          echo "       PHARMABILL APK BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "Artifact:"
          echo "PharmaBill-APK"
          echo ""
          echo "File:"
          echo "PharmaBill.apk"
          echo ""
          echo "The APK is ready in GitHub Actions Artifacts."
          echo "=============================================="
