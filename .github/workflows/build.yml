name: Build PharmaBill Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PharmaBill APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------------------------------------------------------
      # 2. Show repository
      # ---------------------------------------------------------
      - name: Show repository files
        shell: bash
        run: |
          set -e
          echo "===== Repository ====="
          pwd
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            | sort | head -300

      # ---------------------------------------------------------
      # 3. Setup Node
      # ---------------------------------------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Check Node and npm
        run: |
          node --version
          npm --version

      # ---------------------------------------------------------
      # 4. Find PharmaBill application directory
      # ---------------------------------------------------------
      - name: Find application directory
        id: app
        shell: bash
        run: |
          set -e

          APP_DIR=""

          # Root project
          if [ -f "package.json" ]; then
            APP_DIR="."
          else
            # Search for package.json, ignoring node_modules/.git
            FOUND=$(find . -type f -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/.git/*' \
              | head -1 || true)

            if [ -n "$FOUND" ]; then
              APP_DIR="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: package.json was not found."
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          APP_DIR="${APP_DIR#./}"

          if [ -z "$APP_DIR" ]; then
            APP_DIR="."
          fi

          echo "Application directory: $APP_DIR"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 5. Verify package.json
      # ---------------------------------------------------------
      - name: Verify Node project
        working-directory: ${{ steps.app.outputs.app_dir }}
        shell: bash
        run: |
          set -e

          echo "Application directory:"
          pwd

          echo
          echo "package.json:"
          test -f package.json
          cat package.json

      # ---------------------------------------------------------
      # 6. Install npm dependencies
      #
      # --legacy-peer-deps handles the Vite/Tailwind peer
      # dependency conflict shown in your previous screenshot.
      #
      # We intentionally do NOT use setup-node npm cache here
      # because your project previously had no lock file at the
      # expected location.
      # ---------------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ steps.app.outputs.app_dir }}
        shell: bash
        run: |
          set -e

          npm install --legacy-peer-deps --no-audit --no-fund

      # ---------------------------------------------------------
      # 7. Check Capacitor
      # ---------------------------------------------------------
      - name: Check Capacitor
        working-directory: ${{ steps.app.outputs.app_dir }}
        shell: bash
        run: |
          set -e

          echo "===== Capacitor packages ====="
          npm list @capacitor/core @capacitor/cli @capacitor/android \
            --depth=0 || true

          echo
          echo "===== Capacitor files ====="
          find . -maxdepth 2 \
            \( -name 'capacitor.config.ts' \
            -o -name 'capacitor.config.json' \
            -o -name 'capacitor.config.js' \
            \) -print

      # ---------------------------------------------------------
      # 8. Build web application if a build script exists
      # ---------------------------------------------------------
      - name: Build web application
        working-directory: ${{ steps.app.outputs.app_dir }}
        shell: bash
        run: |
          set -e

          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
            echo "Running npm build..."
            npm run build
          else
            echo "No build script found. Continuing..."
          fi

      # ---------------------------------------------------------
      # 9. Setup Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # ---------------------------------------------------------
      # 10. Setup Android SDK
      #
      # This replaces the broken SDK setup from your screenshot.
      # setup-android installs cmdline-tools and exposes sdkmanager.
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # ---------------------------------------------------------
      # 11. Explicitly repair SDK PATH
      # ---------------------------------------------------------
      - name: Verify and repair Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            if [ -n "${ANDROID_HOME:-}" ]; then
              export ANDROID_SDK_ROOT="$ANDROID_HOME"
            else
              export ANDROID_SDK_ROOT="$HOME/.android/sdk"
            fi
          fi

          echo "Using SDK: $ANDROID_SDK_ROOT"

          CMDLINE_TOOLS=""

          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_TOOLS="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          else
            CMDLINE_TOOLS=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              -print -quit 2>/dev/null \
              | xargs -r dirname || true)
          fi

          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "SDK directory:"
            find "$ANDROID_SDK_ROOT" -maxdepth 5 -type f \
              -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "sdkmanager directory: $CMDLINE_TOOLS"

          echo "$CMDLINE_TOOLS" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          "$CMDLINE_TOOLS/sdkmanager" --version

      # ---------------------------------------------------------
      # 12. Accept Android licenses
      # ---------------------------------------------------------
      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

      # ---------------------------------------------------------
      # 13. Install required Android packages
      # ---------------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ---------------------------------------------------------
      # 14. Verify Android SDK
      # ---------------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "sdkmanager:"
          which sdkmanager
          sdkmanager --version

          echo
          echo "adb:"
          which adb || true

          echo
          echo "Installed Android packages:"
          sdkmanager --list_installed | head -100

      # ---------------------------------------------------------
      # 15. Check Android project
      # ---------------------------------------------------------
      - name: Check Android project
        working-directory: ${{ steps.app.outputs.app_dir }}
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Android directory does not exist."

            echo "Checking Capacitor..."
            npx cap --version

            echo "Creating Android platform..."
            npx cap add android
          fi

          test -d android

          echo "Android project found:"
          find android -maxdepth 2 -type f \
            \( -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
            -o -name 'gradle-wrapper.properties' \
            -o -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            \) -print

      # ---------------------------------------------------------
      # 16. Sync Capacitor
      # ---------------------------------------------------------
      - name: Sync Android
        working-directory: ${{ steps.app.outputs.app_dir }}
        shell: bash
        run: |
          set -e

          npx cap sync android

      # ---------------------------------------------------------
      # 17. Verify Gradle wrapper
      # ---------------------------------------------------------
      - name: Verify Gradle
        working-directory: ${{ steps.app.outputs.app_dir }}/android
        shell: bash
        run: |
          set -e

          test -f gradlew

          chmod +x gradlew

          ./gradlew --version

      # ---------------------------------------------------------
      # 18. Build Debug APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ steps.app.outputs.app_dir }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      # ---------------------------------------------------------
      # 19. Find APK
      # ---------------------------------------------------------
      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.app.outputs.app_dir }}
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find android -type f -name "*.apk" -print

          APK=$(find android -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -1 || true)

          if [ -z "$APK" ]; then
            APK=$(find android -type f -name "*.apk" \
              | head -1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 20. Copy APK to predictable filename
      # ---------------------------------------------------------
      - name: Prepare APK artifact
        working-directory: ${{ steps.app.outputs.app_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "${{ steps.apk.outputs.apk_path }}" \
            release/PharmaBill-debug.apk

          ls -lh release/PharmaBill-debug.apk

      # ---------------------------------------------------------
      # 21. Upload APK
      #
      # IMPORTANT:
      # This uploads the actual .apk file.
      # It will NOT be uploaded as a ZIP containing the project.
      # ---------------------------------------------------------
      - name: Upload PharmaBill APK
        uses: actions/upload-artifact@v5
        with:
          name: PharmaBill-APK
          path: ${{ steps.app.outputs.app_dir }}/release/PharmaBill-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # 22. Build summary
      # ---------------------------------------------------------
      - name: Build summary
        if: success()
        working-directory: ${{ steps.app.outputs.app_dir }}
        shell: bash
        run: |
          echo "## PharmaBill Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build successful." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**APK:** PharmaBill-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from the **Artifacts** section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
