name: Build PharmaBill APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-apk:
    name: Build PharmaBill Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Node.js
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager-cache: false

      # =========================================================
      # 3. Verify project
      # =========================================================
      - name: Verify project
        run: |
          test -f package.json
          echo "package.json found"
          node --version
          npm --version

      # =========================================================
      # 4. Install existing dependencies
      # =========================================================
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      # =========================================================
      # 5. Install Capacitor
      # =========================================================
      - name: Install Capacitor
        run: |
          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            --save \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      # =========================================================
      # 6. Build web application
      # =========================================================
      - name: Build web application
        run: |
          npm run build

      # =========================================================
      # 7. Create Capacitor configuration
      # =========================================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.pharmabill.app',
            appName: 'PharmaBill',
            webDir: 'dist'
          };

          export default config;
          EOF

          echo "Capacitor configuration created."

      # =========================================================
      # 8. Initialize Android project
      # =========================================================
      - name: Add Android platform
        run: |
          npx cap add android

      # =========================================================
      # 9. Copy web build into Android project
      # =========================================================
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # =========================================================
      # 10. Setup Java
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # =========================================================
      # 11. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # 12. Build debug APK
      # =========================================================
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # =========================================================
      # 13. Find APK
      # =========================================================
      - name: Find APK
        run: |
          echo "Searching for APK..."

          find android -type f -name "*.apk" -print

          APK=$(find android -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release
          cp "$APK" release/PharmaBill.apk

      # =========================================================
      # 14. Upload APK
      # =========================================================
      - name: Upload PharmaBill APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaBill-APK
          path: release/PharmaBill.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 15. Summary
      # =========================================================
      - name: Build summary
        run: |
          echo "=========================================="
          echo "       PHARMABILL APK BUILD SUCCESS"
          echo "=========================================="
          ls -lh release/PharmaBill.apk
