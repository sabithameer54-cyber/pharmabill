name: PharmaBill APK Test

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test runner
        run: |
          echo "================================"
          echo "PharmaBill GitHub Actions works!"
          echo "================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

      - name: Show files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort | head -200

      - name: Check package.json
        run: |
          if find . -name package.json -not -path "*/node_modules/*" | grep -q package.json; then
            echo "package.json FOUND"
            find . -name package.json -not -path "*/node_modules/*"
          else
            echo "WARNING: package.json not found"
          fi

      - name: Success
        run: |
          echo "================================"
          echo "ACTION TEST SUCCESSFUL"
          echo "================================"
