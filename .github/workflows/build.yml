name: Build PharmaBill Android APK

run-name: PharmaBill APK Build #${{ github.run_number }}

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PharmaBill Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # SHOW REPOSITORY
      # ============================================================
      - name: Show repository files
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "PHARMABILL APK BUILD"
          echo "============================================"

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch:     $GITHUB_REF_NAME"
          echo "Commit:     $GITHUB_SHA"

          echo ""
          echo "Repository contents:"

          find . -maxdepth 5 -type f \
            ! -path "./.git/*" \
            | sort

      # ============================================================
      # FIND PHARMABILL.ZIP
      # ============================================================
      - name: Find PharmaBill ZIP
        id: zip
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "FINDING PHARMABILL.ZIP"
          echo "============================================"

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/PharmaBill.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/PharmaBill.zip"
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              -iname "PharmaBill.zip" \
              | head -1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: PharmaBill.zip was not found."

            echo ""
            echo "Files in repository:"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 8 \
              -type f \
              ! -path "*/.git/*" \
              | sort

            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          PROJECT_ROOT="$GITHUB_WORKSPACE/pharmabill-project"

          rm -rf "$PROJECT_ROOT"
          mkdir -p "$PROJECT_ROOT"

          echo ""
          echo "ZIP CONTENTS:"
          unzip -l "$ZIP_FILE" | head -300

          echo ""
          echo "Extracting..."

          unzip -q "$ZIP_FILE" -d "$PROJECT_ROOT"

          echo ""
          echo "Extraction complete."

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # FIND PACKAGE.JSON
      # ============================================================
      - name: Find PharmaBill project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="${{ steps.zip.outputs.project_root }}"

          echo "============================================"
          echo "SEARCHING FOR package.json"
          echo "============================================"

          PACKAGE_JSON=$(find "$PROJECT_ROOT" \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            | head -1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found."

            echo ""
            echo "Extracted files:"

            find "$PROJECT_ROOT" \
              -maxdepth 12 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "package.json:"
          echo "$PACKAGE_JSON"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # NODE 20
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: ""

      # ============================================================
      # CHECK NODE
      # ============================================================
      - name: Check Node environment
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "NODE ENVIRONMENT"
          echo "============================================"

          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Project:"
          pwd

      # ============================================================
      # INSTALL NPM
      # ============================================================
      - name: Install npm dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "INSTALLING NPM DEPENDENCIES"
          echo "============================================"

          if [ -f package-lock.json ]; then

            echo "package-lock.json found."

            npm ci \
              --legacy-peer-deps \
              --no-audit \
              --no-fund

          else

            echo "package-lock.json not found."

            npm install \
              --legacy-peer-deps \
              --no-audit \
              --no-fund

          fi

      # ============================================================
      # DETECT CAPACITOR
      # ============================================================
      - name: Detect Capacitor
        id: capacitor
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "DETECTING CAPACITOR"
          echo "============================================"

          CAP_VERSION=$(node - <<'NODE'
          const p = require('./package.json');

          const version =
            p.dependencies?.["@capacitor/core"] ||
            p.devDependencies?.["@capacitor/core"] ||
            "";

          process.stdout.write(version);
          NODE
          )

          echo "Capacitor version:"
          echo "${CAP_VERSION:-not found}"

          CAP_MAJOR=$(echo "$CAP_VERSION" | grep -oE '[0-9]+' | head -1 || true)

          if [ -z "$CAP_MAJOR" ]; then
            CAP_MAJOR="7"
          fi

          echo "Capacitor major:"
          echo "$CAP_MAJOR"

          echo "cap_major=$CAP_MAJOR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # INSTALL CAPACITOR
      # ============================================================
      - name: Install Capacitor packages
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          CAP_MAJOR="${{ steps.capacitor.outputs.cap_major }}"

          echo "============================================"
          echo "INSTALLING CAPACITOR"
          echo "============================================"

          npm install \
            "@capacitor/core@${CAP_MAJOR}" \
            "@capacitor/android@${CAP_MAJOR}" \
            --save \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

          npm install \
            "@capacitor/cli@${CAP_MAJOR}" \
            --save-dev \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

          echo ""
          echo "Capacitor CLI version:"

          npx cap --version

      # ============================================================
      # CAPACITOR CONFIG
      # ============================================================
      - name: Create Capacitor configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "CAPACITOR CONFIGURATION"
          echo "============================================"

          rm -f capacitor.config.ts
          rm -f capacitor.config.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.pharmabill.app",
            "appName": "PharmaBill",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          echo ""
          cat capacitor.config.json

      # ============================================================
      # BUILD WEB
      # ============================================================
      - name: Build web application
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "BUILDING WEB APPLICATION"
          echo "============================================"

          if npm run | grep -qE '^[[:space:]]+build'; then

            npm run build

          else

            echo "ERROR: No build script found in package.json."

            npm run

            exit 1

          fi

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo ""
          echo "DIST DIRECTORY:"

          find dist -maxdepth 4 -type f | sort | head -300

      # ============================================================
      # JAVA 21
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # VERIFY JAVA 21
      # ============================================================
      - name: Verify Java 21
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "JAVA 21"
          echo "============================================"

          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "Java version:"

          java -version

          echo ""
          echo "Javac version:"

          javac -version

          JAVA_VERSION=$(java -version 2>&1 | head -1)

          echo ""
          echo "Using:"
          echo "$JAVA_VERSION"

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "ANDROID SDK"
          echo "============================================"

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name "sdkmanager" \
              -executable \
              2>/dev/null \
              | sort -V \
              | tail -1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find \
              /usr/local/lib/android \
              /opt/android-sdk \
              /opt/android \
              -type f \
              -name "sdkmanager" \
              -executable \
              2>/dev/null \
              | sort -V \
              | tail -1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo ""
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installing Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK ready."

      # ============================================================
      # CREATE ANDROID
      # ============================================================
      - name: Create Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "ANDROID PROJECT"
          echo "============================================"

          if [ -d "android" ]; then

            echo "Android project already exists."

          else

            echo "Creating Android project..."

            npx cap add android

          fi

          if [ ! -d "android" ]; then
            echo "ERROR: Android project was not created."
            exit 1
          fi

      # ============================================================
      # CAPACITOR SYNC
      # ============================================================
      - name: Sync Capacitor Android
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "CAPACITOR SYNC"
          echo "============================================"

          npx cap sync android

      # ============================================================
      # VERIFY GRADLE JAVA VERSION
      # ============================================================
      - name: Verify Gradle Java 21
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "GRADLE JAVA CHECK"
          echo "============================================"

          chmod +x gradlew

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          java -version

          echo ""
          echo "Gradle version:"

          ./gradlew --version

      # ============================================================
      # BUILD APK
      # ============================================================
      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        run: |
          set +e

          echo "============================================"
          echo "BUILDING DEBUG APK"
          echo "============================================"

          chmod +x gradlew

          LOG="$GITHUB_WORKSPACE/gradle-build.log"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            > "$LOG" 2>&1

          EXIT_CODE=$?

          echo ""
          echo "============================================"
          echo "BUILD RESULT"
          echo "============================================"

          echo "Gradle exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "============================================"
            echo "WHAT WENT WRONG"
            echo "============================================"

            grep -n -A 60 -B 15 \
              "What went wrong:" \
              "$LOG" \
              | tail -150 || true

            echo ""
            echo "============================================"
            echo "EXECUTION FAILED"
            echo "============================================"

            grep -n -A 50 -B 15 \
              "Execution failed for task" \
              "$LOG" \
              | tail -150 || true

            echo ""
            echo "============================================"
            echo "JAVA / COMPILER ERRORS"
            echo "============================================"

            grep -niE \
              "invalid source release|javac|Java compilation|Kotlin|Compilation failed" \
              "$LOG" \
              | tail -150 || true

            echo ""
            echo "============================================"
            echo "ANDROID ERRORS"
            echo "============================================"

            grep -niE \
              "AAPT|AAPT2|resource .* not found|Manifest merger|compileSdk|buildTools" \
              "$LOG" \
              | tail -150 || true

            echo ""
            echo "============================================"
            echo "CAUSED BY"
            echo "============================================"

            grep -n -A 30 \
              "Caused by:" \
              "$LOG" \
              | tail -150 || true

            echo ""
            echo "============================================"
            echo "LAST 200 LINES"
            echo "============================================"

            tail -200 "$LOG"

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "============================================"
          echo "APK BUILD SUCCESSFUL"
          echo "============================================"

      # ============================================================
      # UPLOAD GRADLE LOG
      # ============================================================
      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PharmaBill-Gradle-Log-${{ github.run_number }}
          path: ${{ github.workspace }}/gradle-build.log
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # FIND APK
      # ============================================================
      - name: Find generated APK
        id: apk
        if: success()
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "FINDING APK"
          echo "============================================"

          APK=$(find android \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | sort \
            | head -1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            find android \
              -type f \
              -name "*.apk" \
              2>/dev/null \
              | sort || true

            exit 1

          fi

          echo "APK:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/PharmaBill-debug.apk

          echo ""
          echo "Final APK:"
          ls -lh release/PharmaBill-debug.apk

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PharmaBill-APK-${{ github.run_number }}
          path: ${{ steps.project.outputs.project_dir }}/release/PharmaBill-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # GITHUB RELEASE
      # ============================================================
      - name: Create GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pharmabill-${{ github.run_number }}
          name: PharmaBill APK ${{ github.run_number }}
          body: |
            PharmaBill Android APK

            Build: ${{ github.run_number }}

            Commit: ${{ github.sha }}

            APK: PharmaBill-debug.apk
          files: ${{ steps.project.outputs.project_dir }}/release/PharmaBill-debug.apk
          generate_release_notes: false

      # ============================================================
      # SUCCESS
      # ============================================================
      - name: Build complete
        if: success()
        shell: bash
        run: |
          echo ""
          echo "============================================"
          echo "PHARMABILL APK READY"
          echo "============================================"
          echo ""
          echo "PharmaBill-debug.apk was successfully created."
          echo ""
          echo "It is available under:"
          echo "Actions -> Artifacts"
          echo ""
          echo "It is also uploaded to:"
          echo "Releases"
          echo ""
          echo "============================================"
