name: Build PharmaBill

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build PharmaBill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "Checking package.json:"
          test -f package.json
          echo "package.json FOUND"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify build
        run: |
          echo "Build successful!"
          echo ""
          echo "Build output:"
          ls -la dist
