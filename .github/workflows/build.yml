name: PharmaBill APK Builder

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build PharmaBill APK
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v7


      # =====================================================
      # 2. SHOW FILES
      # =====================================================

      - name: Show repository
        run: |
          echo "Repository:"
          pwd
          echo ""
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort | head -300


      # =====================================================
      # 3. FIND PHARMABILL ZIP
      # =====================================================

      - name: Find PharmaBill ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP=""

          if [ -f "PharmaBill.zip" ]; then
            ZIP="PharmaBill.zip"
          elif [ -f "pharmabill.zip" ]; then
            ZIP="pharmabill.zip"
          else
            ZIP=$(find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | head -1 || true)
          fi

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "Found: $ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"


      # =====================================================
      # 4. EXTRACT PROJECT
      # =====================================================

      - name: Extract PharmaBill
        run: |
          set -e

          rm -rf project

          mkdir -p project

          unzip -q -o \
            "${{ steps.zip.outputs.ZIP }}" \
            -d project

          echo "Extraction complete."

          find project -maxdepth 5 -type f \
            ! -path "*/node_modules/*" \
            | sort | head -500


      # =====================================================
      # 5. FIND PACKAGE.JSON
      # =====================================================

      - name: Find project directory
        shell: bash
        run: |
          set -e

          PACKAGE=$(find project \
            -type f \
            -name package.json \
            ! -path "*/node_modules/*" \
            | head -1 || true)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          APP=$(dirname "$PACKAGE")

          echo "Application directory:"
          echo "$APP"

          echo "APP=$APP" >> "$GITHUB_ENV"


      # =====================================================
      # 6. NODE
      # =====================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          package-manager-cache: false


      # =====================================================
      # 7. NODE CHECK
      # =====================================================

      - name: Check Node
        run: |
          node -v
          npm -v


      # =====================================================
      # 8. INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          npm install \
            --legacy-peer-deps \
            --no-audit \
            --no-fund


      # =====================================================
      # 9. PREPARE CAPACITOR
      # =====================================================

      - name: Prepare Capacitor
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          echo "Checking Capacitor..."

          CORE_VERSION=$(node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync("package.json"));
            const d={
              ...(p.dependencies || {}),
              ...(p.devDependencies || {})
            };
            console.log(d["@capacitor/core"] || "");
          ')

          echo "Core version: $CORE_VERSION"

          if [[ "$CORE_VERSION" =~ ^([0-9]+)\. ]]; then

            MAJOR="${BASH_REMATCH[1]}"

            echo "Capacitor major: $MAJOR"

            npm install \
              --save-dev \
              "@capacitor/cli@^${MAJOR}.0.0" \
              --legacy-peer-deps \
              --no-audit \
              --no-fund

            npm install \
              "@capacitor/core@^${MAJOR}.0.0" \
              "@capacitor/android@^${MAJOR}.0.0" \
              --legacy-peer-deps \
              --no-audit \
              --no-fund

          else

            echo "Capacitor not found."

            npm install \
              --save-dev \
              @capacitor/cli \
              --legacy-peer-deps \
              --no-audit \
              --no-fund

            npm install \
              @capacitor/core \
              @capacitor/android \
              --legacy-peer-deps \
              --no-audit \
              --no-fund

          fi

          echo ""
          echo "Capacitor version:"

          npx --yes cap --version


      # =====================================================
      # 10. CREATE CAPACITOR CONFIG IF MISSING
      # =====================================================

      - name: Check Capacitor configuration
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          if [ -f "capacitor.config.ts" ] || \
             [ -f "capacitor.config.js" ] || \
             [ -f "capacitor.config.json" ]; then

            echo "Capacitor configuration exists."

          else

            echo "Creating capacitor.config.ts"

            cat > capacitor.config.ts <<'EOF'
import type { CapacitorConfig } from '@capacitor/cli';

const config: CapacitorConfig = {
  appId: 'com.pharmabill.app',
  appName: 'PharmaBill',
  webDir: 'dist'
};

export default config;
EOF

            cat capacitor.config.ts

          fi


      # =====================================================
      # 11. BUILD WEB APP
      # =====================================================

      - name: Build web application
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          if npm run | grep -qE "^[[:space:]]+build"; then

            npm run build

          else

            echo "No build script found."

          fi


      # =====================================================
      # 12. ANDROID SDK
      # =====================================================
      #
      # No setup-android action.
      # Use the Android SDK already installed on runner.
      #

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK="$ANDROID_HOME"
          else
            echo "Android SDK not found."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then

            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          else

            SDKMANAGER=$(find "$SDK/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null \
              | head -1 || true)

            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager not found."
              exit 1
            fi

            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          fi

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"


      # =====================================================
      # 13. VERIFY SDK
      # =====================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "sdkmanager:"
          command -v sdkmanager

          sdkmanager --version

          echo ""
          echo "adb:"
          command -v adb

          adb version


      # =====================================================
      # 14. INSTALL ANDROID PACKAGES
      # =====================================================

      - name: Install Android packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =====================================================
      # 15. CHECK ANDROID PROJECT
      # =====================================================

      - name: Create Android project
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          if [ -d "android" ] && [ -f "android/gradlew" ]; then

            echo "Android project already exists."

          else

            echo "Android project missing."

            rm -rf android

            echo "Creating Android project..."

            npx --yes cap add android

          fi


      # =====================================================
      # 16. CAPACITOR SYNC
      # =====================================================

      - name: Capacitor sync
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          npx --yes cap sync android


      # =====================================================
      # 17. VERIFY ANDROID
      # =====================================================

      - name: Verify Android project
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          test -d android

          test -f android/gradlew

          echo "Android project is ready."


      # =====================================================
      # 18. JAVA 17
      # =====================================================

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # 19. GRADLE PREPARE
      # =====================================================

      - name: Prepare Gradle
        working-directory: ${{ env.APP }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version


      # =====================================================
      # 20. BUILD APK
      # =====================================================

      - name: Build APK
        working-directory: ${{ env.APP }}/android
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug


      # =====================================================
      # 21. FIND APK
      # =====================================================

      - name: Find APK
        id: apk
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          APK=$(find android \
            -type f \
            -name "*.apk" \
            | head -1 || true)

          if [ -z "$APK" ]; then

            echo "APK was not generated."

            find android \
              -type f \
              | grep -E "\.apk$|build.gradle" \
              | head -300 \
              || true

            exit 1

          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/PharmaBill-debug.apk"

          echo "APK_PATH=$GITHUB_WORKSPACE/release/PharmaBill-debug.apk" \
            >> "$GITHUB_ENV"


      # =====================================================
      # 22. VERIFY APK
      # =====================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -f "$APK_PATH"

          echo "================================="
          echo "APK SUCCESSFULLY CREATED"
          echo "================================="

          ls -lh "$APK_PATH"

          echo ""
          echo "SHA256:"
          sha256sum "$APK_PATH"


      # =====================================================
      # 23. UPLOAD APK
      # =====================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: PharmaBill-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error


      # =====================================================
      # 24. CREATE RELEASE
      # =====================================================

      - name: Create APK Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pharmabill-${{ github.run_number }}
          name: PharmaBill APK ${{ github.run_number }}
          body: |
            PharmaBill Android APK

            Automatically built by GitHub Actions.

            Download the APK from the Assets section.
          files: ${{ env.APK_PATH }}
          generate_release_notes: false


      # =====================================================
      # 25. SUMMARY
      # =====================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "# PharmaBill APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$APK_PATH" ]; then

            echo "## ✅ APK BUILD SUCCESSFUL" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "File: PharmaBill-debug.apk" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Size: $(du -h "$APK_PATH" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

          else

            echo "## ❌ APK BUILD FAILED" >> "$GITHUB_STEP_SUMMARY"

          fi
